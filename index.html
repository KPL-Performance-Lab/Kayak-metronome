<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><title>Kayak Metronomo</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:600px;margin:auto;padding:20px 18px 35px;text-align:center}h1{font-size:22px;margin:6px 0 20px}.rate{font-size:76px;font-weight:800;font-variant-numeric:tabular-nums}.unit{color:#aeb4c0}.row{display:flex;justify-content:center;align-items:center;gap:14px;margin:16px 0}button,input{font:inherit}button{border:1px solid #515765;background:#242936;color:white;border-radius:14px;padding:13px 19px;min-height:52px;cursor:pointer}button:active{opacity:.8}input[type=number]{width:95px;text-align:center;border-radius:12px;border:1px solid #5b626d;background:#171a21;color:white;font-size:24px;padding:12px}input[type=range]{width:100%;accent-color:#ff3030}.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.presets button{min-width:65px}.lamp{width:min(72vw,310px);aspect-ratio:1;border-radius:50%;background:#360909;border:9px solid #9a1818;margin:25px auto;transition:background .045s,box-shadow .045s}.lamp.on{background:#ff1717;box-shadow:0 0 55px #f33,inset 0 0 65px #ff8b8b}.stats{display:flex;justify-content:space-around;color:#bfc4cd;margin:10px 0 20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.start{background:#b91c1c;border-color:#b91c1c;font-weight:700}.full{margin-top:12px;width:100%}.checks{display:flex;justify-content:center;gap:25px;margin:20px 0}label{display:flex;align-items:center;gap:7px}.hint{color:#aab0bb;font-size:13px;line-height:1.5}.fullview{display:none;position:fixed;inset:0;background:#090b10;z-index:10;flex-direction:column;align-items:center;justify-content:space-evenly;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}.fullview.open{display:flex}.fullrate{font-size:clamp(44px,12vw,95px);font-weight:800}.fulllamp{width:min(85vw,58vh);max-width:650px;aspect-ratio:1;border-radius:50%;border:10px solid #8e1515;background:#360909}.fulllamp.on{background:#ff1717;box-shadow:0 0 65px #f33,inset 0 0 75px #ff9292}.fullactions{display:flex;gap:12px}.fullactions button{min-width:125px}#status{min-height:22px}</style></head><body><main><h1>🚣 Kayak Metronomo</h1><div class="rate" id="rate">80</div><div class="unit">colpi al minuto</div><div class="row"><button id="minus" aria-label="Diminuisci">−</button><input type="number" id="input" min="1" max="300" value="80" aria-label="Frequenza"><button id="plus" aria-label="Aumenta">+</button></div><input type="range" id="slider" min="50" max="200" value="80" aria-label="Regola frequenza"><div class="presets"><button data-rate="60">60</button><button data-rate="80">80</button><button data-rate="100">100</button><button data-rate="120">120</button></div><div class="lamp" id="lamp" aria-label="Luce metronomo"></div><div class="stats"><span>Colpi: <b id="count">0</b></span><span>Tempo: <b id="time">00:00</b></span></div><div class="actions"><button class="start" id="start">▶ AVVIA</button><button id="stop">■ FERMA</button></div><button class="full" id="enter">⛶ SCHERMO INTERO</button><div class="checks"><label><input type="checkbox" id="sound" checked> Audio</label><label><input type="checkbox" id="visual" checked> Luce rossa</label></div><p class="hint" id="status" role="status">Un segnale per ogni ciclo di pagaiata.</p><p class="hint">Su iPhone: apri il sito in Safari e scegli Condividi → Aggiungi alla schermata Home. Lo schermo intero effettivo dipende dal browser.</p></main><section class="fullview" id="fullview"><div class="fullrate"><span id="fullrate">80</span> <small style="font-size:.25em">colpi/min</small></div><div class="fulllamp" id="fulllamp"></div><div class="fullactions"><button class="start" id="fullstart">▶ AVVIA</button><button id="exit">✕ ESCI</button></div></section><script>const $=id=>document.getElementById(id);let bpm=80,ctx,active=false,interval=null,seconds=null,next=0,started=0,count=0,generation=0,flashTimeout=null;function setRate(v){let n=Number(v);if(!Number.isFinite(n))n=bpm;bpm=Math.max(1,Math.min(300,Math.round(n)));$('rate').textContent=$('fullrate').textContent=$('input').value=bpm;$('slider').value=Math.max(50,Math.min(200,bpm));if(active&&ctx)next=ctx.currentTime+60/bpm;}function dark(){$('lamp').classList.remove('on');$('fulllamp').classList.remove('on');}function beep(at){if(!$('sound').checked)return;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=950;gain.gain.setValueAtTime(.001,at);gain.gain.exponentialRampToValueAtTime(.35,at+.008);gain.gain.exponentialRampToValueAtTime(.001,at+.075);osc.connect(gain).connect(ctx.destination);osc.start(at);osc.stop(at+.08);}function tick(){if(!active)return;while(next<ctx.currentTime+.09){const t=next,g=generation;beep(t);setTimeout(()=>{if(!active||g!==generation)return;count++;$('count').textContent=count;if($('visual').checked){$('lamp').classList.add('on');$('fulllamp').classList.add('on');clearTimeout(flashTimeout);flashTimeout=setTimeout(dark,Math.min(190,30000/bpm));}},Math.max(0,(t-ctx.currentTime)*1000));next+=60/bpm;}}async function start(){if(active)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Audio non supportato');ctx=ctx||new AC();await ctx.resume();active=true;generation++;count=0;started=Date.now();$('count').textContent='0';$('time').textContent='00:00';next=ctx.currentTime+.1;interval=setInterval(tick,20);seconds=setInterval(()=>{const s=Math.floor((Date.now()-started)/1000);$('time').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},250);$('status').textContent='Metronomo in funzione';$('fullstart').textContent='■ FERMA';tick();}catch(e){$('status').textContent='Errore: '+e.message;}}function stop(){active=false;generation++;clearInterval(interval);clearInterval(seconds);clearTimeout(flashTimeout);dark();$('fullstart').textContent='▶ AVVIA';$('status').textContent='Metronomo fermato';}function enter(){ $('fullview').classList.add('open');if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});}function exit(){ $('fullview').classList.remove('open');if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});} $('minus').addEventListener('click',()=>setRate(bpm-1));$('plus').addEventListener('click',()=>setRate(bpm+1));$('input').addEventListener('change',e=>setRate(e.target.value));$('slider').addEventListener('input',e=>setRate(e.target.value));document.querySelectorAll('[data-rate]').forEach(b=>b.addEventListener('click',()=>setRate(b.dataset.rate)));$('start').addEventListener('click',start);$('stop').addEventListener('click',stop);$('enter').addEventListener('click',enter);$('exit').addEventListener('click',exit);$('fullstart').addEventListener('click',()=>active?stop():start());document.addEventListener('keydown',e=>{if(e.key==='Escape')exit()});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
